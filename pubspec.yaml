name: jennigas_customer
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # stacked
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  # Google maps
  google_maps_flutter: ^2.14.0
  # Email validator
  email_validator: ^3.0.0
  # icons
  bootstrap_icons: ^1.11.3
  # internationalization
  intl: ^0.20.2
  # firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  # socket.io
  socket_io_client: ^3.1.2
  # geolocator
  geolocator: ^14.0.2
  # permission_handler
  permission_handler: ^12.0.1
  # geocoding
  geocoding: ^4.0.0
  # launcher
  url_launcher: ^6.3.2
  # http requests
  dio: ^5.9.0
  # dio logger
  pretty_dio_logger: ^1.4.0
  # jennygas_lib
  jennygas_lib:
    path: ../jennygas_lib
  # escaneo de QR (confirmacion de entrega)
  mobile_scanner: ^7.2.0
  # Idempotency-Key para requests no idempotentes
  uuid: ^4.5.3

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.1
  stacked_generator: ^2.0.0
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/
